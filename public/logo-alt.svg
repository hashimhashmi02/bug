<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Legs -->
  <g stroke="#3a3a3a" stroke-width="20" stroke-linecap="round">
    <line x1="120" y1="250" x2="40" y2="200"/>
    <line x1="120" y1="300" x2="40" y2="330"/>
    <line x1="120" y1="350" x2="60" y2="450"/>

    <line x1="392" y1="250" x2="472" y2="200"/>
    <line x1="392" y1="300" x2="472" y2="330"/>
    <line x1="392" y1="350" x2="452" y2="450"/>
  </g>

  <!-- Antennae -->
  <g stroke="#ff3d1a" stroke-width="24" stroke-linecap="round">
    <line x1="210" y1="90" x2="170" y2="20"/>
    <line x1="302" y1="90" x2="342" y2="20"/>
  </g>

  <!-- Head -->
  <ellipse cx="256" cy="120" rx="80" ry="60" fill="#3a3a3a"/>

  <!-- Neck -->
  <ellipse cx="256" cy="170" rx="90" ry="60" fill="#f9a623"/>

  <!-- Body -->
  <ellipse cx="256" cy="300" rx="150" ry="190" fill="#ff3d1a"/>

  <!-- Center line -->
  <rect x="246" y="230" width="20" height="260" rx="10" fill="#d93216"/>

  <!-- Spots -->
  <circle cx="200" cy="270" r="28" fill="#3a3a3a"/>
  <circle cx="312" cy="270" r="28" fill="#3a3a3a"/>
  <circle cx="200" cy="340" r="28" fill="#3a3a3a"/>
  <circle cx="312" cy="340" r="28" fill="#3a3a3a"/>

</svg>  